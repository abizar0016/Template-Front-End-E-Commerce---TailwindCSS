<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail - ShopVite</title>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { createNavbar } from '/src/components/layout/navbar.js'
      import { createFooter } from '/src/components/layout/footer.js'
      import { createProductGallery } from '/src/components/product/product-gallery.js'
      import { products } from '/src/data/products.js'
      import { formatCurrency } from '/src/utils/formatCurrency.js'
      import { addToCart } from '/src/store/cartStore.js'

      const app = document.getElementById('app')
      const product = products[0] // Demo: show first product

      const main = document.createElement('main')
      main.className = 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10'

      main.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
          <div id="gallery"></div>
          <div>
            <p class="text-sm text-indigo-600 font-medium uppercase tracking-wider mb-2">${product.category}</p>
            <h1 class="text-3xl font-bold text-gray-900 mb-4">${product.name}</h1>
            <div class="flex items-center gap-2 mb-4">
              <span class="text-yellow-400">★</span>
              <span class="text-sm text-gray-600">${product.rating} (${product.reviews} reviews)</span>
            </div>
            <div class="flex items-baseline gap-3 mb-6">
              <span class="text-3xl font-bold text-gray-900">${formatCurrency(product.price)}</span>
              ${product.originalPrice ? `<span class="text-lg text-gray-400 line-through">${formatCurrency(product.originalPrice)}</span>` : ''}
            </div>
            <p class="text-gray-600 leading-relaxed mb-8">${product.description}</p>
            <button id="add-to-cart-btn" class="w-full md:w-auto px-8 py-3.5 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors cursor-pointer">
              Add to Cart
            </button>
          </div>
        </div>
      `

      // Insert gallery
      const galleryContainer = main.querySelector('#gallery')
      galleryContainer.appendChild(createProductGallery([product.image]))

      // Add to cart
      main.querySelector('#add-to-cart-btn').addEventListener('click', () => addToCart(product))

      app.append(createNavbar(), main, createFooter())
    </script>
  </body>
</html>
