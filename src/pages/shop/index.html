<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - VENORA</title>
    <meta name="description" content="Browse our complete collection of premium furniture and home decor." />
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-800 dark:text-gray-200 antialiased transition-colors duration-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      import { createNavbar } from '/src/components/layout/navbar.js'
      import { createFooter } from '/src/components/layout/footer.js'
      import { createProductCard } from '/src/components/product/product-card.js'
      import { products } from '/src/data/products.js'
      import { categories } from '/src/data/categories.js'

      const app = document.getElementById('app')

      const main = document.createElement('main')
      main.className = 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8'

      main.innerHTML = `
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 mb-6">
          <a href="/" class="hover:text-violet-600 dark:hover:text-violet-400 transition-colors">Home</a>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          <span class="text-gray-900 dark:text-white font-medium">Shop</span>
        </nav>

        <div class="flex items-center justify-between mb-8">
          <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white">Shop</h1>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500 dark:text-gray-400 hidden sm:inline">Showing 1-${products.length} of ${products.length} results</span>
            <select class="text-sm border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-violet-500">
              <option>Sort by: Featured</option>
              <option>Price: Low to High</option>
              <option>Price: High to Low</option>
              <option>Newest</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
          <!-- Sidebar Filters -->
          <aside class="lg:col-span-1 space-y-6">
            <!-- Categories -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-5">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-4">Categories</h3>
              <ul class="space-y-2">
                <li>
                  <a href="#" class="flex items-center justify-between text-sm font-medium text-violet-600 dark:text-violet-400">
                    <span>All Categories</span>
                    <span class="text-xs text-gray-400">${products.length}</span>
                  </a>
                </li>
                ${categories.map(cat => `
                  <li>
                    <a href="#" class="flex items-center justify-between text-sm text-gray-600 dark:text-gray-300 hover:text-violet-600 dark:hover:text-violet-400 transition-colors">
                      <span>${cat.name}</span>
                      <span class="text-xs text-gray-400">${cat.count}</span>
                    </a>
                  </li>
                `).join('')}
              </ul>
            </div>

            <!-- Price Range -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-5">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-4">Price Range</h3>
              <div class="space-y-3">
                <input type="range" min="0" max="1000" value="500" class="w-full accent-violet-600" />
                <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400">
                  <span>$0</span>
                  <span>$1000</span>
                </div>
              </div>
            </div>

            <!-- Colors -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-5">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-4">Colors</h3>
              <div class="flex flex-wrap gap-2">
                ${['#1F2937', '#7C3AED', '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#D1D5DB'].map(c => `
                  <button class="w-7 h-7 rounded-full border-2 border-transparent hover:border-violet-400 transition-colors cursor-pointer ring-2 ring-transparent hover:ring-violet-200" style="background-color: ${c}"></button>
                `).join('')}
              </div>
            </div>
          </aside>

          <!-- Product Grid -->
          <div id="product-grid" class="lg:col-span-3 grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 content-start"></div>
        </div>
      `

      // Populate products
      const grid = main.querySelector('#product-grid')
      products.forEach(p => grid.appendChild(createProductCard(p)))

      app.append(createNavbar(), main, createFooter())
    </script>
  </body>
</html>
