<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ShopVite</title>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const app = document.getElementById('app')
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center px-4 py-12">
          <div class="w-full max-w-md">
            <div class="text-center mb-8">
              <a href="/" class="text-2xl font-bold text-indigo-600">ShopVite</a>
              <h1 class="text-2xl font-bold text-gray-900 mt-6">Create an account</h1>
              <p class="text-gray-500 mt-2">Start shopping with ShopVite</p>
            </div>
            <form class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 space-y-5" onsubmit="event.preventDefault()">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
                <input type="text" placeholder="John Doe" required
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                <input type="email" placeholder="you@example.com" required
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                <input type="password" placeholder="••••••••" required
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
                <input type="password" placeholder="••••••••" required
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
              </div>
              <button type="submit"
                class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors cursor-pointer">
                Create Account
              </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
              Already have an account? <a href="/src/pages/auth/login.html" class="text-indigo-600 font-medium hover:text-indigo-700">Sign in</a>
            </p>
          </div>
        </div>
      `
    </script>
  </body>
</html>
